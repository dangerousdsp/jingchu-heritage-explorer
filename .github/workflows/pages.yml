name: Check and publish Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: JavaScript tests
        run: npm test
      - name: Python tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Arrange Unity data uploaded at repository root
        shell: python
        run: |
          from pathlib import Path
          import shutil
          destination = Path('dist/runtime/Build')
          destination.mkdir(parents=True, exist_ok=True)
          for index in range(17):
              source = Path(f'data-{index:02d}.bin')
              target = destination / source.name
              if source.is_file() and not target.exists():
                  shutil.copy2(source, target)
      - name: Build public static site
        run: python scripts/package_release.py --public --auto-webgl --output output/github-pages
      - name: Validate public release
        run: python scripts/check_release.py output/github-pages
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: output/github-pages
  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
