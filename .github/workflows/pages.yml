name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.site.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare website
        id: site
        shell: python
        run: |
          from pathlib import Path
          import os
          import shutil
          site = Path('_site')
          shutil.copytree('dist', site)
          (site / 'deployment.mjs').write_text('export const VIDEO_ENABLED = false;\n', encoding='utf-8')
          (site / '.nojekyll').touch()
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              print(f"artifact_name=github-pages-{os.environ['GITHUB_RUN_ATTEMPT']}", file=output)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: ${{ steps.site.outputs.artifact_name }}
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
